<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gutman Academy | האקדמיה הפרונטלית ללימודי AI בישראל</title>
    <meta name="description" content="מסלולי AI פרונטליים ומעשיים למנהלי סושיאל, סטודנטים, יוצרי תוכן, עורכי וידאו ובעלי עסקים. לומדים דרך בנייה ויוצאים עם תוצר אמיתי." />
    <meta name="author" content="Gutman" />

    <!-- אין SSR באתר, ולכן זחלני הרשתות החברתיות רואים אך ורק את התגיות
         הסטטיות שכאן. useSeo מזריק og:title ו-og:description בזמן ריצה,
         וזה משרת דפדפנים אבל לא זחלן שלא מריץ JS. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gutman Academy" />
    <meta property="og:url" content="https://gutmanai.com/" />
    <meta property="og:title" content="Gutman Academy | האקדמיה הפרונטלית ללימודי AI בישראל" />
    <meta property="og:description" content="מסלולי AI פרונטליים ומעשיים למנהלי סושיאל, סטודנטים, יוצרי תוכן, עורכי וידאו ובעלי עסקים. לומדים דרך בנייה ויוצאים עם תוצר אמיתי." />
    <!-- שם קובץ חדש ולא דריסה של og-teaser.png: הרשתות מטמינות את תמונת
         השיתוף לפי כתובת, ושם חדש הוא הדרך היחידה לאלץ אותן למשוך מחדש. -->
    <meta property="og:image" content="https://gutmanai.com/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="הסימן של Gutman Academy לצד הכותרת: לא רק ללמוד AI, לדעת לעבוד איתו" />
    <meta property="og:locale" content="he_IL" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://gutmanai.com/og-cover.png" />
    <!-- theme-color תואם לקנבס הכהה. קודם הוא היה #f4f4f2 מהגרסה הבהירה,
         והדפדפן במובייל צבע סרגל בהיר מעל אתר שחור. -->
    <meta name="theme-color" content="#0d0c11" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- שמירה למסך הבית: אייקון ה-G הוורוד והשם GutmanAi -->
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="GutmanAi" />
    <meta name="application-name" content="GutmanAi" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- גופנים מקומיים: Assistant (גרוטסק) + Frank Ruhl Libre (סריף תצוגה) -->
    <link rel="preload" href="/fonts/frank-ruhl-libre-500-hebrew.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/assistant-400-hebrew.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

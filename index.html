<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gutman Academy | סמינרי AI מעשיים ביום אחד</title>
    <meta name="description" content="סמינרי AI פרונטליים למנהלי סושיאל, יוצרי תוכן ובעלי עסקים. חמש שעות של עבודה מעשית בקבוצה קטנה, בהנחיית רון גוטמן." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="author" content="Gutman" />

    <!-- אין SSR באתר, ולכן זחלני הרשתות החברתיות רואים אך ורק את התגיות
         הסטטיות שכאן. useSeo מזריק og:title ו-og:description בזמן ריצה,
         וזה משרת דפדפנים אבל לא זחלן שלא מריץ JS. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gutman Academy" />
    <meta property="og:url" content="https://gutmanai.com/" />
    <meta property="og:title" content="Gutman Academy | סמינרי AI מעשיים ביום אחד" />
    <meta property="og:description" content="סמינרי AI פרונטליים למנהלי סושיאל, יוצרי תוכן ובעלי עסקים. חמש שעות של עבודה מעשית בקבוצה קטנה, בהנחיית רון גוטמן." />
    <!-- שם קובץ חדש ולא דריסה של og-teaser.png: הרשתות מטמינות את תמונת
         השיתוף לפי כתובת, ושם חדש הוא הדרך היחידה לאלץ אותן למשוך מחדש. -->
    <meta property="og:image" content="https://gutmanai.com/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="הסימן של Gutman Academy לצד הכותרת: לא רק ללמוד AI, לדעת לעבוד איתו" />
    <meta property="og:locale" content="he_IL" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://gutmanai.com/og-cover.png" />
    <!-- theme-color תואם לקנבס הכהה. קודם הוא היה #f4f4f2 מהגרסה הבהירה,
         והדפדפן במובייל צבע סרגל בהיר מעל אתר שחור. -->
    <meta name="theme-color" content="#0d0c11" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- שמירה למסך הבית: אייקון ה-G הוורוד והשם GutmanAi -->
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="GutmanAi" />
    <meta name="application-name" content="GutmanAi" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- גופנים מקומיים: Assistant (גוף וכותרות) + Rubik (תצוגה). רק
         העברית של Assistant נטענת מראש: היא הגופן של הטקסט הראשון שנצבע. -->
    <link rel="preload" href="/fonts/assistant-400-hebrew.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/rubik-400-hebrew.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      if (location.pathname === '/' && (!location.hash || location.hash.startsWith('#/') === false || location.hash === '#/')) {
        const heroImage = document.createElement('link');
        heroImage.rel = 'preload'; heroImage.as = 'image'; heroImage.fetchPriority = 'high';
        heroImage.href = '/images/academy-creative-portal.webp';
        heroImage.imageSrcset = '/images/academy-creative-portal-1024.webp 1024w, /images/academy-creative-portal.webp 1672w';
        heroImage.imageSizes = '100vw'; document.head.appendChild(heroImage);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

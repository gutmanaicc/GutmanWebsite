# Hostinger Docker Manager OPTIONAL overlay; both images must be built first.
# OPTIONAL overlay: direct original Drive download to this project's own media
# volume, then local transcoding. No media files enter Git or any artifact store.
services:
  academy:
    depends_on:
      media-seed:
        condition: service_completed_successfully
    volumes:
      - academy_preview_media:/app/dist/videos/first-cohort:ro
  media-seed:
    image: gutman-academy-preview-media:${GUTMAN_MEDIA_IMAGE_TAG:-${GUTMAN_IMAGE_TAG:?Set the media image tag already built on this VPS}}
    pull_policy: never
    command: ['node', '/app/scripts/self-hosted-media-seed.mjs']
    restart: 'no'
    init: true
    healthcheck:
      disable: true
    environment:
      ACADEMY_TESTIMONIAL_SOURCE: ${ACADEMY_TESTIMONIAL_SOURCE:-}
      ACADEMY_TESTIMONIAL_SOURCE_SHA256: ${ACADEMY_TESTIMONIAL_SOURCE_SHA256:-}
    volumes:
      - academy_preview_media:/media
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 0.75
    pids_limit: 100
    labels:
      - traefik.enable=false
volumes:
  academy_preview_media:
